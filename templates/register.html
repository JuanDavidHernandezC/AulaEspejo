<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - Hampite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-green-100 to-emerald-200">

  <!-- Navbar -->
  <nav class="bg-white/80 backdrop-blur-md shadow-sm px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="logo" class="w-6 h-6">
      <span class="text-lg font-semibold text-green-700">Hampite</span>
    </div>
    <ul class="flex gap-6 text-gray-700">
      <li><a href="/" class="hover:text-green-700">Inicio</a></li>
      <li><a href="/productos" class="hover:text-green-700">Productos</a></li>
      <li><a href="/nosotros" class="hover:text-green-700">Nosotros</a></li>
      <li><a href="/contacto" class="hover:text-green-700">Contacto</a></li>
      <li><a href="/login" class="font-medium text-green-700 hover:text-green-800">Iniciar sesión</a></li>
      <li><a href="/register" class="bg-green-600 text-white px-3 py-1 rounded-md hover:bg-green-700">Registrarse</a></li>
    </ul>
  </nav>

  <!-- Formulario centrado -->
  <div class="flex-grow flex items-center justify-center">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Crear cuenta</h2>

      <form action="/register" method="POST" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Nombre completo</label>
          <input type="text" name="name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Correo electrónico</label>
          <input type="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Contraseña</label>
          <input type="password" name="password" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2 rounded-md hover:bg-green-700 transition">
          Registrarse
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-4">
        ¿Ya tienes cuenta?
        <a href="/login" class="text-green-700 font-medium hover:underline">Inicia sesión</a>
      </p>
    </div>
  </div>

</body>
</html>
