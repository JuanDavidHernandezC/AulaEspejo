{% extends "base.html" %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block content %}
  <div class="flex-grow flex items-center justify-center py-5">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Iniciar sesión</h2>

      <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Correo electrónico</label>
          <input type="email" name="email" required placeholder="tucorreo@ejemplo.com"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Contraseña</label>
          <input type="password" name="contraseña" required placeholder="********"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <button type="submit"
          class="w-full bg-green-600 text-white font-semibold py-2 rounded-md hover:bg-green-700 transition">
          Entrar
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-4">
        ¿No tienes cuenta?
        <a href="{{ url_for('register') }}" class="text-green-700 font-medium hover:underline">Regístrate</a>
      </p>
    </div>
  </div>
{% endblock %}
