{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">

<section class="contact-hero">
  <h1>📬 Contáctanos</h1>
  <p>Nos encanta escuchar a nuestros clientes. Envíanos tus dudas o sugerencias.</p>
</section>

<section class="contact-form">
  <form>
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" placeholder="Tu nombre completo" required>
    </div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" placeholder="tucorreo@ejemplo.com" required>
    </div>

    <div class="form-group">
      <label>Mensaje</label>
      <textarea rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
    </div>

    <button type="submit" class="btn">Enviar mensaje</button>
  </form>
</section>

<section class="contact-info">
  <div class="info-card">
    <h3>📍 Dirección</h3>
    <p>Av. Hampite Verde #123, Ciudad Natural</p>
  </div>
  <div class="info-card">
    <h3>📞 Teléfono</h3>
    <p>+52 55 1234 5678</p>
  </div>
  <div class="info-card">
    <h3>📧 Correo</h3>
    <p>contacto@hampite.com</p>
  </div>
</section>

{% endblock %}
