<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hampite{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- NAVBAR personalizada -->
    <nav class="nav-container">
      <!-- Logo -->
      <div class="nav-logo">
        🍃 <span>Hampite</span>
      </div>

      <!-- Botones de navegación -->
      <div class="button-container">
        <!-- Inicio -->
        <a href="{{ url_for('index') }}" class="nav-btn" title="Inicio">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="currentColor" class="icon">
            <path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204z"/>
          </svg>
          <span>Inicio</span>
        </a>

        <!-- Productos -->
        <a href="{{ url_for('products') }}" class="nav-btn" title="Productos">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" class="icon">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Productos</span>
        </a>

        <!-- Nosotros -->
        <a href="{{ url_for('about') }}" class="nav-btn" title="Nosotros">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
            <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5Z"/>
          </svg>
          <span>Nosotros</span>
        </a>

        <!-- Contacto -->
        <a href="{{ url_for('contact') }}" class="nav-btn" title="Contacto">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" class="icon">
            <path d="M22 2L11 13"></path>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
          </svg>
          <span>Contacto</span>
        </a>
      </div>

      <!-- Usuario / Login -->
      <div class="nav-user">
        {% if g.user %}
          <span class="welcome">👋 {{ g.user.nombre }}</span>
          <a href="{{ url_for('logout') }}" class="auth-link logout">
            <svg xmlns="http://www.w3.org/2000/svg" class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Salir
          </a>
        {% else %}
          <a href="{{ url_for('login') }}" class="auth-link login">
            <svg xmlns="http://www.w3.org/2000/svg" class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M6 20v-2a6 6 0 0 1 12 0v2"/>
            </svg>
            Login
          </a>

          <a href="{{ url_for('register') }}" class="auth-link register">
            <svg xmlns="http://www.w3.org/2000/svg" class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M6 20v-2a6 6 0 0 1 12 0v2"/>
              <line x1="20" y1="12" x2="20" y2="18"/>
              <line x1="17" y1="15" x2="23" y2="15"/>
            </svg>
            Registro
          </a>
        {% endif %}
      </div>
    </nav>

    <!-- Contenido -->
    <main class="main-container">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
